<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>极客车载播放器 - 界面预览 (比亚迪大屏横屏适配)</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0B0B0E;
            color: #FFFFFF;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        /* 模拟比亚迪 15.6 英寸横屏车机屏幕 */
        .car-screen {
            width: 1100px;
            height: 620px;
            background: #121216;
            border-radius: 16px;
            border: 3px solid #22222A;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            display: flex;
            overflow: hidden;
            position: relative;
        }
        /* 左侧主播放区 */
        .player-main {
            flex: 1.2;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            border-right: 1px solid #1E1E26;
        }
        .format-badge {
            align-self: flex-start;
            background: rgba(0, 229, 255, 0.12);
            color: #00E5FF;
            font-size: 13px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 4px;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }
        .song-title {
            font-size: 38px;
            font-weight: 800;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .song-artist {
            font-size: 18px;
            color: #888899;
            margin-bottom: 30px;
        }
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #252530;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 30px;
            cursor: pointer;
        }
        .progress-fill {
            width: 35%;
            height: 100%;
            background: linear-gradient(90deg, #00B0FF, #00E5FF);
        }
        .controls {
            display: flex;
            align-items: center;
            gap: 24px;
        }
        .btn-ctrl {
            background: #22222A;
            color: #FFF;
            border: none;
            width: 70px;
            height: 60px;
            border-radius: 12px;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-ctrl:hover { background: #30303C; transform: scale(1.05); }
        .btn-play {
            width: 110px;
            height: 75px;
            background: #00E5FF;
            color: #000;
            font-size: 32px;
            font-weight: bold;
            border-radius: 16px;
            box-shadow: 0 8px 25px rgba(0, 229, 255, 0.3);
        }
        .btn-play:hover { background: #33EBFF; transform: scale(1.05); }
        .btn-scan {
            background: #2D2D38;
            color: #DDD;
            border: none;
            padding: 0 20px;
            height: 60px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            margin-left: auto;
        }

        /* 右侧调音台与曲库 */
        .player-side {
            flex: 1;
            padding: 30px;
            background: #17171D;
            display: flex;
            flex-direction: column;
        }
        .panel-title {
            font-size: 18px;
            font-weight: 700;
            color: #FFF;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .eq-item { margin-bottom: 12px; }
        .eq-header {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            color: #9999AA;
            margin-bottom: 6px;
        }
        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #2D2D38;
            border-radius: 3px;
            outline: none;
            accent-color: #00E5FF;
        }
        .track-list {
            flex: 1;
            overflow-y: auto;
            margin-top: 15px;
            background: #121216;
            border-radius: 10px;
            padding: 8px;
            border: 1px solid #252530;
        }
        .track-item {
            padding: 12px 14px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            background: #1A1A22;
        }
        .track-item:hover, .track-item.active {
            background: #262635;
            color: #00E5FF;
        }
        .badge-format {
            font-size: 11px;
            background: #333344;
            padding: 2px 6px;
            border-radius: 4px;
            color: #AAA;
        }
    </style>
</head>
<body>

<div class="car-screen">
    <!-- 左侧主播放区 -->
    <div class="player-main">
        <div class="format-badge">HI-RES PCM • 48kHz / 24-bit</div>
        <div class="song-title">Hotel California (加州旅馆)</div>
        <div class="song-artist">Eagles (老鹰乐队) - 现场现场无损版</div>
        <div class="progress-bar-container">
            <div class="progress-fill"></div>
        </div>
        <div class="controls">
            <button class="btn-ctrl">⏮</button>
            <button class="btn-ctrl btn-play">▶</button>
            <button class="btn-ctrl">⏭</button>
            <button class="btn-scan">📂 扫描 U 盘</button>
        </div>
    </div>

    <!-- 右侧车载 DSP 调音台与曲库 -->
    <div class="player-side">
        <div class="panel-title">🎛️ 车载极客 DSP 实时调音台</div>
        
        <div class="eq-item">
            <div class="eq-header">
                <span>重低音 (100Hz)</span>
                <span id="txtBass">+4 dB</span>
            </div>
            <input type="range" min="-12" max="12" value="4" oninput="document.getElementById('txtBass').innerText = (this.value > 0 ? '+' : '') + this.value + ' dB'">
        </div>

        <div class="eq-item">
            <div class="eq-header">
                <span>中音人声 (1kHz)</span>
                <span id="txtMid">+2 dB</span>
            </div>
            <input type="range" min="-12" max="12" value="2" oninput="document.getElementById('txtMid').innerText = (this.value > 0 ? '+' : '') + this.value + ' dB'">
        </div>

        <div class="eq-item">
            <div class="eq-header">
                <span>明亮高音 (10kHz)</span>
                <span id="txtTreble">0 dB</span>
            </div>
            <input type="range" min="-12" max="12" value="0" oninput="document.getElementById('txtTreble').innerText = (this.value > 0 ? '+' : '') + this.value + ' dB'">
        </div>

        <div class="eq-item">
            <div class="eq-header">
                <span>车载声场拓宽 (Mid-Side)</span>
                <span id="txtWidth">35%</span>
            </div>
            <input type="range" min="0" max="100" value="35" oninput="document.getElementById('txtWidth').innerText = this.value + '%'">
        </div>

        <div class="panel-title" style="margin-top: 15px; margin-bottom: 8px;">📁 U 盘曲目列表</div>
        <div class="track-list">
            <div class="track-item active">
                <span>01. Hotel California</span>
                <span class="badge-format">FLAC</span>
            </div>
            <div class="track-item">
                <span>02. 渡口 - 蔡琴 (试音曲目)</span>
                <span class="badge-format">WAV</span>
            </div>
            <div class="track-item">
                <span>03. 加州旅馆 (吉他开场)</span>
                <span class="badge-format">FLAC</span>
            </div>
        </div>
    </div>
</div>

</body>
</html>
