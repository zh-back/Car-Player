name: Build Car Player APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Setup Android SDK, NDK and CMake
        uses: android-actions/setup-android@v3
        with:
          packages: 'ndk;25.2.9519653 cmake;3.22.1 platforms;android-33 build-tools;33.0.2'

      - name: Accept Android Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CarPlayer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "Car Player v1.0.0 (APK)"
          body: |
            极客车载音乐播放器 (专为比亚迪 DiLink 车机定制)
            
            - 纯 Java 架构 + C 语言底层 AAudio 直驱
            - 3段参数 EQ 实时调音 + Mid-Side 声场拓宽 + 防爆音软限幅
            - 车载导航智能压音 (Ducking) + 方向盘方控
            
            安装方式：
            下载下方的 `app-debug.apk`，放入 U 盘插入车机，在车机“文件管理”中点击安装。
          files: app/build/outputs/apk/debug/app-debug.apk
          draft: false
          prerelease: false
